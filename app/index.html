<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2c3e50">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pedido Ferreteria</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f6fa;color:#2c3e50;padding-bottom:80px;-webkit-tap-highlight-color:transparent}
.hdr{background:#2c3e50;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.hdr h1{font-size:17px;font-weight:600;flex:1}
.btn-b{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:2px 6px;display:none}
.btn-i{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:4px 8px}
.scr{display:none;padding:12px}.scr.on{display:block}
.srch{position:sticky;top:50px;z-index:90;padding:8px 0;background:#f5f6fa}
.srch input{width:100%;padding:11px 14px;border:2px solid #e0e0e0;border-radius:10px;font-size:15px;outline:none;background:#fff}
.srch input:focus{border-color:#3498db}
.pc{background:#fff;border-radius:12px;padding:14px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;transition:transform .12s}
.pc:active{transform:scale(.98)}
.pc h3{font-size:15px;margin-bottom:3px}.pc .m{font-size:12px;color:#7f8c8d}
.pi{background:#fff;border-radius:10px;padding:10px;margin-bottom:7px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.pi-img{width:50px;height:50px;border-radius:8px;background:#ecf0f1;display:flex;align-items:center;justify-content:center;font-size:18px;color:#bdc3c7;flex-shrink:0;overflow:hidden}
.pi-img img{width:100%;height:100%;object-fit:cover}
.pi-info{flex:1;min-width:0}
.pi-sku{font-size:11px;color:#7f8c8d;font-weight:600}
.pi-nom{font-size:13px;font-weight:500;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pi-pre{font-size:13px;color:#27ae60;font-weight:700;margin-top:1px}
.pi-act{display:flex;align-items:center;gap:5px;flex-shrink:0}
.bc{width:30px;height:30px;border-radius:8px;border:none;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.bc-m{background:#fee;color:#e74c3c}.bc-p{background:#e8f8f5;color:#27ae60}
.cd{font-size:15px;font-weight:700;min-width:22px;text-align:center}
.bar{position:fixed;bottom:0;left:0;right:0;background:#2c3e50;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 -2px 10px rgba(0,0,0,.2);z-index:100;cursor:pointer}
.bar.hid{display:none}
.bar .t{font-size:17px;font-weight:700}
.bar .r{font-size:13px}
.ped-i{background:#fff;border-radius:10px;padding:12px;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between}
.ped-i .inf{flex:1}
.ped-i .sk{font-size:11px;color:#7f8c8d}
.ped-i .nm{font-size:14px;font-weight:500}
.ped-i .pr{font-size:12px;color:#27ae60}
.ped-i input{width:48px;padding:4px;text-align:center;border:1px solid #ddd;border-radius:6px;font-size:14px}
.ped-i .rm{background:#fee;color:#e74c3c;border:none;width:26px;height:26px;border-radius:50%;font-size:15px;cursor:pointer;margin-left:6px}
.tot{background:#fff;border-radius:12px;padding:16px;margin-top:12px;text-align:right}
.tot .lb{font-size:13px;color:#7f8c8d}.tot .am{font-size:22px;font-weight:700;color:#27ae60}
.fg{margin-bottom:10px}.fg label{display:block;font-size:12px;font-weight:600;margin-bottom:3px}
.fg input,.fg textarea{width:100%;padding:10px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none}
.fg input:focus,.fg textarea:focus{border-color:#3498db}
.fg textarea{resize:vertical;min-height:50px}
.btn-pdf{width:100%;padding:14px;background:#e74c3c;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;margin-top:12px}
.btn-pdf:active{opacity:.9}
.btn-upd{width:100%;padding:14px;background:#3498db;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;margin-top:12px}
.btn-upd:active{opacity:.9}
.btn-sel{display:block;width:100%;padding:16px;background:#fff;border:2px dashed #3498db;border-radius:12px;font-size:15px;color:#3498db;cursor:pointer;text-align:center;margin-top:12px}
.btn-sel:active{background:#ebf5fb}
.empty{text-align:center;padding:40px 20px;color:#95a5a6}.empty .ic{font-size:44px;margin-bottom:10px}
.lds{text-align:center;padding:30px;color:#95a5a6}
.info-bar{background:#ebf5fb;border-radius:8px;padding:8px 12px;font-size:12px;color:#2980b9;margin-bottom:10px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#27ae60;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:200;display:none;box-shadow:0 2px 8px rgba(0,0,0,.2)}
</style>
</head>
<body>
<div class="hdr">
 <button class="btn-b" id="bb" onclick="goBack()">&#8249;</button>
 <h1 id="ht">Mis Pedidos</h1>
 <button class="btn-i" id="bi" onclick="showUpdate()" style="display:none" title="Actualizar">&#8635;</button>
</div>

<div class="scr on" id="s1">
 <div id="pls" class="lds">Cargando...</div>
</div>
<div class="scr" id="s2">
 <div class="srch"><input type="search" id="si" placeholder="Buscar SKU o producto..." oninput="buscar()"></div>
 <div id="plp"></div>
</div>
<div class="scr" id="s3">
 <div id="pei"></div>
 <div class="tot"><div class="lb">Total estimado</div><div class="am" id="ptt">0.00</div></div>
 <div class="fg" style="margin-top:14px"><label>Nombre</label><input id="cn" placeholder="Tu nombre"></div>
 <div class="fg"><label>Notas</label><textarea id="pno" placeholder="Instrucciones..."></textarea></div>
 <button class="btn-pdf" onclick="genPDF()">Descargar PDF</button>
</div>
<div class="scr" id="s4">
 <div style="text-align:center;padding:20px">
  <div style="font-size:48px;margin-bottom:12px">&#128260;</div>
  <h2>Actualizar catalogo</h2>
  <p style="color:#7f8c8d;margin:8px 0;font-size:14px">Selecciona el archivo <b>productos.json</b> nuevo</p>
  <div id="updInfo" class="info-bar" style="display:none"></div>
  <input type="file" id="fileIn" accept=".json" style="display:none" onchange="handleFile(this)">
  <label for="fileIn" class="btn-sel">Seleccionar archivo JSON</label>
  <button class="btn-upd" onclick="show('s1');document.getElementById('bb').style.display='none';document.getElementById('bi').style.display='none'" style="margin-top:12px;background:#95a5a6">Volver</button>
 </div>
</div>

<div class="bar hid" id="pbr" onclick="verPedido()">
 <div><div class="r"><span id="pcn">0</span> productos</div><div class="t">Bs. <span id="ptb">0.00</span></div></div>
 <div style="font-size:13px">Ver pedido &#8250;</div>
</div>

<div class="toast" id="toast"></div>

<script>
var DATA=[];
var S={prov:null,prods:[],pedido:{},page:0};

// IndexedDB
var DB_NAME='PedidoDB';
var DB_STORE='data';

function openDB(cb){
 var req=indexedDB.open(DB_NAME,1);
 req.onupgradeneeded=function(e){
  var db=e.target.result;
  if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE);
 };
 req.onsuccess=function(e){cb(e.target.result);};
 req.onerror=function(){cb(null);};
}

function saveData(data,cb){
 openDB(function(db){
  if(!db){cb(false);return;}
  var tx=db.transaction(DB_STORE,'readwrite');
  tx.objectStore(DB_STORE).put(data,'productos');
  tx.oncomplete=function(){cb(true);};
  tx.onerror=function(){cb(false);};
 });
}

function loadData(cb){
 openDB(function(db){
  if(!db){cb(null);return;}
  var tx=db.transaction(DB_STORE,'readonly');
  var req=tx.objectStore(DB_STORE).get('productos');
  req.onsuccess=function(){cb(req.result||null);};
  req.onerror=function(){cb(null);};
 });
}

function getFechaActualizacion(){
 return localStorage.getItem('fechaActualizacion')||null;
}

function setFechaActualizacion(){
 var now=new Date();
 var s=now.toLocaleDateString('es-VE')+' '+now.toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit'});
 localStorage.setItem('fechaActualizacion',s);
 return s;
}

function showToast(msg){
 var t=document.getElementById('toast');
 t.textContent=msg;
 t.style.display='block';
 setTimeout(function(){t.style.display='none';},3000);
}

function handleFile(input){
 var file=input.files[0];
 if(!file)return;
 var reader=new FileReader();
 reader.onload=function(e){
  try{
   var data=JSON.parse(e.target.result);
   if(!Array.isArray(data)||!data.length){
    alert('Archivo no valido. Debe ser un JSON con productos.');
    return;
   }
   if(!data[0].sku||!data[0].nombre){
    alert('Archivo no tiene formato de productos.');
    return;
   }
   saveData(data,function(ok){
    if(ok){
     var f=setFechaActualizacion();
     document.getElementById('updInfo').style.display='block';
     document.getElementById('updInfo').textContent='Actualizado: '+f+' ('+data.length+' productos)';
     DATA=data;
     showToast('Catalogo actualizado: '+data.length+' productos');
     setTimeout(function(){
      show('s1');
      renderProveedores();
     },1500);
    }else{
     alert('Error al guardar.');
    }
   });
  }catch(ex){
   alert('Archivo JSON invalido.');
  }
 };
 reader.readAsText(file);
}

function init(){
 document.getElementById('pls').innerHTML='<div class="ic">&#128230;</div><p>Cargando productos...</p>';
 loadData(function(saved){
  if(saved&&saved.length){
   DATA=saved;
   renderProveedores();
  }else{
   fetch('data/productos.json').then(function(r){return r.json()}).then(function(d){
    DATA=d;
    saveData(d,function(){});
    setFechaActualizacion();
    renderProveedores();
   }).catch(function(){
    document.getElementById('pls').innerHTML='<div class="ic">&#9888;</div><p>Error al cargar datos</p>';
   });
  }
 });
}

function renderProveedores(){
 var fecha=getFechaActualizacion();
 var html='<div class="pc" onclick="selProv()"><h3>LC 2050</h3><div class="m">'+DATA.length+' productos</div>';
 if(fecha)html+='<div class="m">Actualizado: '+fecha+'</div>';
 html+='</div>';
 html+='<button class="btn-upd" onclick="showUpdate()">Actualizar catalogo</button>';
 document.getElementById('pls').innerHTML=html;
 document.getElementById('bi').style.display='inline';
}

function showUpdate(){
 document.getElementById('ht').textContent='Actualizar';
 show('s4');
 document.getElementById('fileIn').value='';
 document.getElementById('updInfo').style.display='none';
 var fecha=getFechaActualizacion();
 if(fecha){
  document.getElementById('updInfo').style.display='block';
  document.getElementById('updInfo').textContent='Ultima actualizacion: '+fecha;
 }
}

function selProv(){
 S.prov='lc_2050';
 S.prods=DATA;
 S.page=0;
 document.getElementById('ht').textContent='LC 2050';
 show('s2');
 document.getElementById('bb').style.display='inline';
 renderProds();
}

var st;
function buscar(){
 clearTimeout(st);
 st=setTimeout(function(){
  var q=document.getElementById('si').value.toLowerCase();
  if(!q){S.prods=DATA;}
  else{S.prods=DATA.filter(function(p){return (p.sku&&p.sku.toLowerCase().indexOf(q)>=0)||(p.nombre&&p.nombre.toLowerCase().indexOf(q)>=0);});}
  S.page=0;
  renderProds();
 },200);
}

function renderProds(){
 var el=document.getElementById('plp');
 var d=S.prods.slice(0,(S.page+1)*50);
 if(!d.length){el.innerHTML='<div class="empty"><div class="ic">&#128270;</div><p>Sin resultados</p></div>';return;}
 el.innerHTML=d.map(function(p){
  var c=S.pedido[p.sku]||0;
  var pr=p.precio_texto?parseFloat(p.precio_texto.replace(',','.')):null;
  var img='<div class="pi-img">&#128230;</div>';
  if(p.sku){img='<div class="pi-img"><img src="../proveedores/lc_2050/images/'+p.sku+'.jpg" onerror="this.parentElement.innerHTML=\'&#128230;\'" alt=""></div>';}
  return '<div class="pi">'+img+'<div class="pi-info"><div class="pi-sku">'+p.sku+'</div><div class="pi-nom">'+p.nombre+'</div>'+(pr!==null&&!isNaN(pr)?'<div class="pi-pre">Bs. '+pr.toFixed(2)+'</div>':'')+'</div><div class="pi-act">'+(c>0?'<button class="bc bc-m" onclick="event.stopPropagation();cc(\''+p.sku+'\',-1)">-</button><span class="cd">'+c+'</span>':'')+'<button class="bc bc-p" onclick="event.stopPropagation();cc(\''+p.sku+'\',1)">+</button></div></div>';
 }).join('');
 if(d.length<S.prods.length){
  el.innerHTML+='<div style="text-align:center;padding:10px"><button onclick="S.page++;renderProds()" style="padding:8px 18px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer">Cargar mas</button></div>';
 }
}

function cc(sku,d){
 var c=(S.pedido[sku]||0)+d;
 if(c<=0)delete S.pedido[sku];else S.pedido[sku]=c;
 renderProds();
 updBar();
}

function updBar(){
 var n=Object.keys(S.pedido).length;
 var b=document.getElementById('pbr');
 if(!n){b.classList.add('hid');return;}
 b.classList.remove('hid');
 document.getElementById('pcn').textContent=n;
 var t=0;
 for(var sku in S.pedido){
  var p=S.prods.find(function(x){return x.sku===sku;});
  if(p&&p.precio_texto){var pr=parseFloat(p.precio_texto.replace(',','.'));if(!isNaN(pr))t+=pr*S.pedido[sku];}
 }
 document.getElementById('ptb').textContent=t.toFixed(2);
}

function verPedido(){
 document.getElementById('ht').textContent='Mi Pedido';
 show('s3');
 renderPed();
}

function renderPed(){
 var el=document.getElementById('pei');
 var t=0;
 var items=Object.keys(S.pedido).map(function(sku){
  var c=S.pedido[sku];
  var p=S.prods.find(function(x){return x.sku===sku;});
  var nm=p?p.nombre:sku;
  var pr=p&&p.precio_texto?parseFloat(p.precio_texto.replace(',','.')):null;
  var st=pr?pr*c:0;t+=st;
  return '<div class="ped-i"><div class="inf"><div class="sk">'+sku+'</div><div class="nm">'+nm+'</div><div class="pr">'+(pr?'Bs. '+pr.toFixed(2):'-')+'</div></div><input type="number" value="'+c+'" min="1" onchange="uc(\''+sku+'\',this.value)"><button class="rm" onclick="ri(\''+sku+'\')">&times;</button></div>';
 });
 el.innerHTML=items.length?items.join(''):'<div class="empty"><div class="ic">&#128722;</div><p>Pedido vacio</p></div>';
 document.getElementById('ptt').textContent=t.toFixed(2);
}

function uc(sku,v){
 var c=parseInt(v);
 if(isNaN(c)||c<=0)delete S.pedido[sku];else S.pedido[sku]=c;
 renderPed();updBar();
}

function ri(sku){
 delete S.pedido[sku];
 renderPed();updBar();
}

function genPDF(){
 var items=[];
 for(var sku in S.pedido)items.push({sku:sku,cant:S.pedido[sku]});
 if(!items.length)return alert('Pedido vacio');

 var jsPDF=window.jspdf.jsPDF;
 var doc=new jsPDF();

 var y=20;
 doc.setFontSize(16);
 doc.text('Pedido - LC 2050',14,y);
 y+=8;
 doc.setFontSize(10);
 doc.setTextColor(120);
 doc.text('Fecha: '+new Date().toLocaleDateString('es-VE'),14,y);
 var cliente=document.getElementById('cn').value;
 if(cliente){y+=6;doc.text('Cliente: '+cliente,14,y);}
 y+=10;

 doc.setTextColor(0);
 doc.setFillColor(44,62,80);
 doc.rect(14,y-5,182,8,'F');
 doc.setTextColor(255);
 doc.setFontSize(9);
 doc.text('SKU',16,y);
 doc.text('Producto',42,y);
 doc.text('Cant',120,y);
 doc.text('Precio',138,y);
 doc.text('Subtotal',162,y);
 y+=8;

 var total=0;
 doc.setTextColor(0);
 items.forEach(function(item,i){
  var p=S.prods.find(function(x){return x.sku===item.sku;});
  var nm=p?p.nombre:item.sku;
  if(nm.length>30)nm=nm.substring(0,27)+'...';
  var pr=p&&p.precio_texto?parseFloat(p.precio_texto.replace(',','.')):0;
  var sub=pr*item.cant;
  total+=sub;

  if(i%2===0){doc.setFillColor(245,246,250);doc.rect(14,y-4,182,7,'F');}

  doc.setFontSize(8);
  doc.text(item.sku,16,y);
  doc.text(nm,42,y);
  doc.text(String(item.cant),122,y);
  doc.text(pr>0?pr.toFixed(2):'-',140,y);
  doc.text(pr>0?sub.toFixed(2):'-',164,y);
  y+=7;

  if(y>270){doc.addPage();y=20;}
 });

 y+=2;
 doc.setDrawColor(44,62,80);
 doc.line(14,y,196,y);
 y+=8;
 doc.setFontSize(12);
 doc.text('Total: Bs. '+total.toFixed(2),164,y,{align:'right'});

 var notas=document.getElementById('pno').value;
 if(notas){y+=10;doc.setFontSize(9);doc.text('Notas: '+notas,14,y);}

 doc.save('pedido_lc2050_'+new Date().toISOString().slice(0,10)+'.pdf');
}

function show(id){
 document.querySelectorAll('.scr').forEach(function(s){s.classList.remove('on');});
 document.getElementById(id).classList.add('on');
}

function goBack(){
 if(document.getElementById('s3').classList.contains('on')){
  document.getElementById('ht').textContent='LC 2050';
  show('s2');
 }else if(document.getElementById('s4').classList.contains('on')){
  renderProveedores();
  document.getElementById('ht').textContent='Mis Pedidos';
 }else{
  S.prov=null;
  document.getElementById('ht').textContent='Mis Pedidos';
  document.getElementById('bb').style.display='none';
  document.getElementById('pbr').classList.add('hid');
  show('s1');
  renderProveedores();
 }
}

init();
</script>
</body>
</html>
