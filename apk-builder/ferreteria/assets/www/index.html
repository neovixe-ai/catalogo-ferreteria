<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Mi Pedido</title>
<style>
:root {

  --success: #1e6b45;
  --bg: #f1f3f6;

  --r-xl: 20px;

* { margin:0; padding:0; box-sizing:border-box; }
::selection { background: var(--primary-container); color: var(--on-primary-container); }
body {
  font-family: Roboto, 'Segoe UI', system-ui, -apple-system, sans-serif;

}
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
input, textarea, button { font-family: inherit; }

}
.btn-back svg { display: block; width: 24px; height: 24px; margin: 0 auto; fill: currentColor; }
.btn-icon {
  background: none;

}

}
.form-group { margin-bottom: 14px; }
.form-group label {

}

}

.btn-full {

  height: 52px;

}
.btn-full:active { filter: brightness(0.92); }
.btn-whatsapp { background: #128c4b; color: #ffffff; }

.btn-settings { background: var(--primary-container); color: var(--on-primary-container); }
.btn-secondary { background: transparent; color: var(--text); border: 1.5px solid var(--outline); }
.btn-info { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
.btn-provider { background: var(--tertiary); color: #ffffff; }

}

<body>

<div class="header">

var DB_NAME = 'PedidoDB';
var DB_VERSION = 2;

function openDB(cb) {
  var req = indexedDB.open(DB_NAME, DB_VERSION);
  req.onupgradeneeded = function(e) {
    var db = e.target.result;
    if (!db.objectStoreNames.contains('products')) {
      db.createObjectStore('products', { keyPath: 'sku' });
    }
    if (!db.objectStoreNames.contains('orders')) {
      db.createObjectStore('orders', { keyPath: 'id' });
    }
  };
  req.onsuccess = function(e) { cb(e.target.result); };
  req.onerror = function() { cb(null); };
}

function saveProducts(products, cb) {
  openDB(function(db) {
    if (!db) { cb(false); return; }
    var tx = db.transaction('products', 'readwrite');
    var store = tx.objectStore('products');
    products.forEach(function(p) { store.put(p); });
    tx.oncomplete = function() { cb(true); };
    tx.onerror = function() { cb(false); };
  });
}

function loadProducts(cb) {
  openDB(function(db) {
    if (!db) { cb([]); return; }
    var tx = db.transaction('products', 'readonly');
    var req = tx.objectStore('products').getAll();
    req.onsuccess = function() { cb(req.result || []); };
    req.onerror = function() { cb([]); };
  });
}

function saveOrders(cb) {
  openDB(function(db) {
    if (!db) { cb(false); return; }
    var tx = db.transaction('orders', 'readwrite');
    var store = tx.objectStore('orders');
    store.put({ id: 'current', orders: orders });
    tx.oncomplete = function() { cb(true); };
    tx.onerror = function() { cb(false); };
  });
}

function loadOrders(cb) {
  openDB(function(db) {
    if (!db) { cb([]); return; }
    var tx = db.transaction('orders', 'readonly');
    var req = tx.objectStore('orders').get('current');
    req.onsuccess = function() {
      var data = req.result;
      cb(data ? data.orders : []);
    };
    req.onerror = function() { cb([]); };
  });
}

function getSetting(key, defaultVal) {
  return localStorage.getItem(key) || defaultVal;
}

function setSetting(key, val) {
  localStorage.setItem(key, val);
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 3000);
}

function formatPrice(val) {
  if (val === null || val === undefined || isNaN(val)) return '-';
  return '$' + val.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function parsePrice(priceStr) {
  if (!priceStr) return null;
  var cleaned = priceStr.replace(/[$\s]/g, '').replace(',', '.');
  var val = parseFloat(cleaned);
  return isNaN(val) ? null : val;
}

function getShortName(name) {
  if (!name) return '';
  var words = name.split(' ').filter(function(w) { return w.length > 0; });
  if (words.length <= 3) return name;
  return words.slice(0, 3).join(' ');
}

function init() {
  if (window.PRODUCTOS && window.PRODUCTOS.length > 0) {
    DATA = window.PRODUCTOS;
    saveProducts(DATA, function() {});
    loadOrders(function(savedOrders) {
      orders = savedOrders;
      updateCatalogInfo();
      renderOrders();
    });
    return;
  }
  loadProducts(function(saved) {
    if (saved && saved.length > 0) {
      DATA = saved;
    } else {
      DATA = loadEmbeddedData();
      saveProducts(DATA, function() {});
    }
    loadOrders(function(savedOrders) {
      orders = savedOrders;
      updateCatalogInfo();
      renderOrders();
    });
  });
}

function renderOrders() {
  var el = document.getElementById('ordersList');
  if (orders.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="icon">' + ICON_BOX + '</div><p>No hay pedidos</p><p style="font-size:13px;margin-top:8px">Crea un nuevo pedido para comenzar</p></div>';
    return;
  }
  el.innerHTML = orders.map(function(order, idx) {
    var itemCount = Object.keys(order.items).length;
    var total = calculateOrderTotal(order.items);
    var date = new Date(order.date).toLocaleDateString('es-VE');
    return '<div class="orders-list" onclick="openOrder(' + idx + ')">' +
      '<h3>Pedido ' + (idx + 1) + '</h3>' +
      '<div class="meta">' + date + ' - ' + itemCount + ' productos</div>' +
      '<div class="total">' + formatPrice(total) + '</div>' +
      '<button class="btn-remove" onclick="event.stopPropagation();deleteOrder(' + idx + ')" aria-label="Eliminar">' + ICON_CLOSE + '</button>' +
      '<div class="order-actions">' +
        '<button class="btn-mini btn-view" onclick="event.stopPropagation();openOrder(' + idx + ')">Visualizar</button>' +
        '<button class="btn-mini btn-edit" onclick="event.stopPropagation();editOrder(' + idx + ')">Editar</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function calculateOrderTotal(items) {
  var total = 0;
  for (var sku in items) {
    var product = DATA.find(function(p) { return p.sku === sku; });
    if (product) {
      var price = parsePrice(product.precio_texto);
      if (price) total += price * items[sku];
    }
  }
  return total;
}

function newOrder() {
  currentOrder = { id: Date.now(), items: {}, date: new Date().toISOString(), notes: '', discountPct: 0, clientName: '' };
  cart = {};
  showScreen('screenCatalog');
  document.getElementById('headerTitle').textContent = 'LC 2050';
  document.getElementById('btnBack').style.display = 'inline';
  document.getElementById('discountPct').value = 0;
  renderProducts();
  setupInfiniteScroll();
}

function openOrder(idx) {
  currentOrder = orders[idx];
  cart = Object.assign({}, currentOrder.items);
  orderSource = 'list';
  showScreen('screenOrder');
  document.getElementById('headerTitle').textContent = 'Pedido ' + (idx + 1);
  document.getElementById('btnBack').style.display = 'inline';
  document.getElementById('discountPct').value = currentOrder.discountPct || 0;
  document.getElementById('clientName').value = currentOrder.clientName || '';
  document.getElementById('orderNotes').value = currentOrder.notes || '';
  renderOrderItems();
}

function editOrder(idx) {
  currentOrder = orders[idx];
  cart = Object.assign({}, currentOrder.items);
  orderSource = 'catalog';
  document.getElementById('discountPct').value = currentOrder.discountPct || 0;
  document.getElementById('clientName').value = currentOrder.clientName || '';
  document.getElementById('orderNotes').value = currentOrder.notes || '';
  showScreen('screenCatalog');
  document.getElementById('headerTitle').textContent = 'LC 2050';
  document.getElementById('btnBack').style.display = 'inline';
  renderProducts();
  setupInfiniteScroll();
  updateBottomBar();
}

function deleteOrder(idx) {
  if (!confirm('Eliminar este pedido?')) return;
  orders.splice(idx, 1);
  saveOrders(function() {
    renderOrders();
    showToast('Pedido eliminado');
  });
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

function goBack() {
  var current = document.querySelector('.screen.active');
  if (current.id === 'screenOrder') {
    saveCurrentOrder();
    if (orderSource === 'catalog') {
      showScreen('screenCatalog');
      document.getElementById('headerTitle').textContent = 'LC 2050';
      document.getElementById('btnBack').style.display = 'inline';
      renderProducts();
      setupInfiniteScroll();
    } else {
      showScreen('screenOrders');
      document.getElementById('headerTitle').textContent = 'Mis Pedidos';
      document.getElementById('btnBack').style.display = 'none';
      document.getElementById('bottomBar').classList.add('hidden');
      renderOrders();
    }
  } else if (current.id === 'screenCatalog') {
    showScreen('screenOrders');
    document.getElementById('headerTitle').textContent = 'Mis Pedidos';
    document.getElementById('btnBack').style.display = 'none';
    document.getElementById('bottomBar').classList.add('hidden');
    renderOrders();
  } else if (current.id === 'screenDetail') {
    showScreen('screenCatalog');
    document.getElementById('headerTitle').textContent = 'LC 2050';
  } else if (current.id === 'screenSettings') {
    showScreen('screenOrders');
    document.getElementById('headerTitle').textContent = 'Mis Pedidos';
    document.getElementById('btnBack').style.display = 'none';
  }
}

function search() {
  searchQuery = document.getElementById('searchInput').value.toLowerCase();
  displayCount = 50;
  renderProducts();
}

function renderProducts() {
  var el = document.getElementById('productsList');
  var filtered = DATA;
  if (searchQuery) {
    filtered = DATA.filter(function(p) {
      return (p.sku && p.sku.toLowerCase().indexOf(searchQuery) >= 0) ||
             (p.nombre && p.nombre.toLowerCase().indexOf(searchQuery) >= 0);
    });
  }
  var products = filtered.slice(0, displayCount);
  if (products.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="icon">' + ICON_SEARCH + '</div><p>Sin resultados</p></div>';
    return;
  }
  el.innerHTML = products.map(function(p) {
    var qty = cart[p.sku] || 0;
    var price = parsePrice(p.precio_texto);
    var imgSrc = 'proveedores/lc_2050/images/' + p.sku + '.webp';
    return '<div class="product-item" onclick="showDetail(\'' + p.sku + '\')">' +
      '<div class="product-img"><img src="' + imgSrc + '" onerror="this.parentElement.innerHTML=ICON_BOX" alt=""></div>' +
      '<div class="product-info">' +
        '<div class="product-sku">' + p.sku + '</div>' +
        '<div class="product-name">' + p.nombre + '</div>' +
        (price ? '<div class="product-price">' + formatPrice(price) + '</div>' : '') +
      '</div>' +
      '<div class="product-actions">' +
        (qty > 0 ? '<button class="btn-qty btn-minus" onclick="event.stopPropagation();updateCart(\'' + p.sku + '\',-1)">-</button><span class="qty-count">' + qty + '</span>' : '') +
        '<button class="btn-qty btn-plus" onclick="event.stopPropagation();updateCart(\'' + p.sku + '\',1)">+</button>' +
      '</div>' +
    '</div>';
  }).join('');
  updateBottomBar();
}

function setupInfiniteScroll() {
  var observer = new IntersectionObserver(function(entries) {
    if (entries[0].isIntersecting && !isLoading) {
      var filtered = searchQuery ? DATA.filter(function(p) {
        return (p.sku && p.sku.toLowerCase().indexOf(searchQuery) >= 0) ||
               (p.nombre && p.nombre.toLowerCase().indexOf(searchQuery) >= 0);
      }) : DATA;
      if (displayCount < filtered.length) {
        isLoading = true;
        displayCount += 50;
        renderProducts();
        isLoading = false;
      }
    }
  }, { threshold: 0.1 });
  var sentinel = document.getElementById('sentinel');
  if (sentinel) observer.observe(sentinel);
}

function showDetail(sku) {
  var product = DATA.find(function(p) { return p.sku === sku; });
  if (!product) return;
  var qty = cart[sku] || 0;
  var price = parsePrice(product.precio_texto);
  var imgSrc = 'proveedores/lc_2050/images/' + sku + '.webp';
  var html = '<div class="modal-img"><img src="' + imgSrc + '" onerror="this.parentElement.innerHTML=ICON_BOX" alt=""></div>' +
    '<h2>' + product.nombre + '</h2>' +
    '<div class="sku">SKU: ' + sku + '</div>' +
    (price ? '<div class="price">' + formatPrice(price) + '</div>' : '<div class="price">Sin precio</div>') +
    '<div class="modal-actions">' +
      '<button class="btn-qty btn-minus" onclick="updateDetailQty(\'' + sku + '\',-1)">-</button>' +
      '<span class="qty-count" id="detailQty">' + qty + '</span>' +
      '<button class="btn-qty btn-plus" onclick="updateDetailQty(\'' + sku + '\',1)">+</button>' +
      '<button class="btn-add" onclick="closeDetail()">Listo</button>' +
    '</div>';
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('active');
  showScreen('screenDetail');
}

function updateDetailQty(sku, delta) {
  updateCart(sku, delta);
  document.getElementById('detailQty').textContent = cart[sku] || 0;
}

function closeDetail() {
  document.getElementById('modalOverlay').classList.remove('active');
  showScreen('screenCatalog');
}

function closeModal(e) {
  if (e.target !== document.getElementById('modalOverlay')) {
    return;
  }
  if (downloadModalOpen) {
    closeDownloadModal();
  } else {
    closeDetail();
  }
}

function showDownloadModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('active');
  downloadModalOpen = true;
}

function closeDownloadModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  downloadModalOpen = false;
}

function updateCart(sku, delta) {
  var current = cart[sku] || 0;
  var newQty = current + delta;
  if (newQty <= 0) {
    delete cart[sku];
  } else {
    cart[sku] = newQty;
  }
  renderProducts();
}

function updateBottomBar() {
  var count = Object.keys(cart).length;
  var bar = document.getElementById('bottomBar');
  if (count === 0) {
    bar.classList.add('hidden');
    return;
  }
  bar.classList.remove('hidden');
  document.getElementById('itemCount').textContent = count;
  var total = 0;
  for (var sku in cart) {
    var product = DATA.find(function(p) { return p.sku === sku; });
    if (product) {
      var price = parsePrice(product.precio_texto);
      if (price) total += price * cart[sku];
    }
  }
  document.getElementById('orderSubtotal').textContent = total.toFixed(2);
}

function viewOrder() {
  if (!currentOrder) {
    currentOrder = { id: Date.now(), items: {}, date: new Date().toISOString(), notes: '', discountPct: 0, clientName: '' };
  }
  orderSource = 'catalog';
  currentOrder.items = Object.assign({}, cart);
  showScreen('screenOrder');
  document.getElementById('headerTitle').textContent = 'Mi Pedido';
  document.getElementById('btnBack').style.display = 'inline';
  document.getElementById('discountPct').value = currentOrder.discountPct || 0;
  renderOrderItems();
}

function saveOrder() {
  saveCurrentOrder();
  showToast('Pedido guardado');
}

function continueShopping() {
  saveCurrentOrder();
  cart = Object.assign({}, currentOrder.items);
  orderSource = 'catalog';
  showScreen('screenCatalog');
  document.getElementById('headerTitle').textContent = 'LC 2050';
  document.getElementById('btnBack').style.display = 'inline';
  renderProducts();
  setupInfiniteScroll();
}

function renderOrderItems() {
  var el = document.getElementById('orderItems');
  var items = currentOrder.items;
  var subtotal = 0;
  var hasDiscontinued = false;
  var discontinuedItems = [];
  
  var rows = Object.keys(items).map(function(sku) {
    var qty = items[sku];
    var product = DATA.find(function(p) { return p.sku === sku; });
    var name = product ? product.nombre : sku;
    var price = product ? parsePrice(product.precio_texto) : null;
    var itemTotal = price ? price * qty : 0;
    subtotal += itemTotal;
    
    if (!product || !price) {
      hasDiscontinued = true;
      discontinuedItems.push(sku);
    }
    
    return '<div class="order-item">' +
      '<div class="info">' +
        '<div class="sku">' + sku + '</div>' +
        '<div class="name">' + name + '</div>' +
        '<div class="price">' + (price ? formatPrice(price) + ' c/u' : 'Sin precio') + '</div>' +
      '</div>' +
      '<input type="number" value="' + qty + '" min="1" onchange="updateOrderQty(\'' + sku + '\',this.value)">' +
      '<button class="remove" onclick="removeFromOrder(\'' + sku + '\')" aria-label="Quitar">' + ICON_CLOSE + '</button>' +
    '</div>';
  });
  
  el.innerHTML = rows.length ? rows.join('') : '<div class="empty-state"><div class="icon">' + ICON_CART + '</div><p>Pedido vacio</p></div>';
  
  var discountPct = parseFloat(document.getElementById('discountPct').value) || 0;
  if (discountPct < 0) discountPct = 0;
  if (discountPct > 100) discountPct = 100;
  
  var discount = subtotal * (discountPct / 100);
  var total = subtotal - discount;
  
  document.getElementById('orderSubtotalDisplay').textContent = formatPrice(subtotal);
  document.getElementById('discountAmount').textContent = '-' + formatPrice(discount);
  document.getElementById('orderTotal').textContent = formatPrice(total);
  
  var warningEl = document.getElementById('discontinuedWarning');
  if (hasDiscontinued) {
    warningEl.innerHTML = '<div class="discontinued-warning">' + ICON_WARN + '<span>Productos sin precio o descontinuados: ' + discontinuedItems.join(', ') + '. No se incluiran en el pedido por WhatsApp.</span></div>';
  } else {
    warningEl.innerHTML = '';
  }
}

function getOrderTotals() {
  var items = currentOrder.items;
  var subtotal = 0;
  for (var sku in items) {
    var product = DATA.find(function(p) { return p.sku === sku; });
    if (product) {
      var price = parsePrice(product.precio_texto);
      if (price) subtotal += price * items[sku];
    }
  }
  var discountPct = parseFloat(document.getElementById('discountPct').value) || 0;
  if (discountPct < 0) discountPct = 0;
  if (discountPct > 100) discountPct = 100;
  var discount = subtotal * (discountPct / 100);
  var total = subtotal - discount;
  return { subtotal: subtotal, discountPct: discountPct, discount: discount, total: total };
}

function updateOrderQty(sku, val) {
  var qty = parseInt(val);
  if (isNaN(qty) || qty <= 0) {
    delete currentOrder.items[sku];
  } else {
    currentOrder.items[sku] = qty;
  }
  cart = Object.assign({}, currentOrder.items);
  renderOrderItems();
  updateBottomBar();
}

function removeFromOrder(sku) {
  delete currentOrder.items[sku];
  cart = Object.assign({}, currentOrder.items);
  renderOrderItems();
  updateBottomBar();
}

function saveCurrentOrder() {
  if (!currentOrder) return;
  currentOrder.items = Object.assign({}, cart);
  currentOrder.notes = document.getElementById('orderNotes').value;
  currentOrder.discountPct = parseFloat(document.getElementById('discountPct').value) || 0;
  currentOrder.clientName = document.getElementById('clientName').value || '';
  
  var existingIdx = -1;
  for (var i = 0; i < orders.length; i++) {
    if (orders[i].id === currentOrder.id) {
      existingIdx = i;
      break;
    }
  }
  
  if (existingIdx >= 0) {
    orders[existingIdx] = currentOrder;
  } else if (Object.keys(currentOrder.items).length > 0) {
    orders.push(currentOrder);
  }
  
  saveOrders(function() {});
}

function sendWhatsApp() {
  saveCurrentOrder();
  
  var phone = getSetting('whatsappNumber', '584121234567');
  var clientName = document.getElementById('clientName').value || getSetting('clientName', '');
  var items = currentOrder.items;
  
  var validItems = [];
  for (var sku in items) {
    var product = DATA.find(function(p) { return p.sku === sku; });
    if (product && parsePrice(product.precio_texto)) {
      validItems.push({
        sku: sku,
        name: getShortName(product.nombre),
        qty: items[sku]
      });
    }
  }
  
  if (validItems.length === 0) {
    alert('No hay productos validos para enviar');
    return;
  }
  
  var lines = ['*Pedido Mi Pedido*', ''];
  if (clientName) lines.push('*Cliente:* ' + clientName);
  lines.push('*Fecha:* ' + new Date().toLocaleDateString('es-VE'));
  lines.push('');
  lines.push('*Productos:*');
  
  validItems.forEach(function(item) {
    lines.push('*' + item.sku + '* ' + item.name + ' x' + item.qty);
  });
  
  if (document.getElementById('orderNotes').value) {
    lines.push('');
    lines.push('*Notas:* ' + document.getElementById('orderNotes').value);
  }
  
  var message = encodeURIComponent(lines.join('\n'));
  var url = 'https://wa.me/' + phone + '?text=' + message;
  window.open(url, '_blank');
}

function downloadPDF() {
  saveCurrentOrder();

  var items = currentOrder.items;
  var validItems = [];
  var totals = getOrderTotals();

  for (var sku in items) {
    var product = DATA.find(function(p) { return p.sku === sku; });
    if (product) {
      var price = parsePrice(product.precio_texto);
      if (price) {
        var subtotal = price * items[sku];
        validItems.push({ sku: sku, name: product.nombre, qty: items[sku], price: price, subtotal: subtotal });
      }
    }
  }

  if (validItems.length === 0) {
    alert('No hay productos para generar PDF');
    return;
  }

  var clientName = document.getElementById('clientName').value || '';
  var notes = document.getElementById('orderNotes').value || '';

  var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Pedido</title>' +
    '<style>body{font-family:Roboto,\'Segoe UI\',Arial,sans-serif;padding:20px;font-size:12px}' +
    'h1{font-size:18px;margin-bottom:5px}table{width:100%;border-collapse:collapse;margin-top:10px}' +
    'th,td{border:1px solid #ddd;padding:6px;text-align:left}th{background:#2c3e50;color:#fff}' +
    '.total{font-size:16px;font-weight:bold;text-align:right;margin-top:10px}' +
    '.discount{color:#e74c3c}.info{margin-bottom:10px;color:#555}</style></head><body>' +
    '<h1>Pedido - LC 2050</h1>' +
    '<div class="info">Fecha: ' + new Date().toLocaleDateString('es-VE') + '</div>' +
    (clientName ? '<div class="info">Cliente: ' + clientName + '</div>' : '') +
    '<table><thead><tr><th>SKU</th><th>Producto</th><th>Cant</th><th>Precio</th><th>Subtotal</th></tr></thead><tbody>';

  validItems.forEach(function(item) {
    html += '<tr><td>' + item.sku + '</td><td>' + item.name + '</td><td>' + item.qty + '</td><td>' + formatPrice(item.price) + '</td><td>' + formatPrice(item.subtotal) + '</td></tr>';
  });

  html += '</tbody></table>' +
    '<div class="total">Subtotal: ' + formatPrice(totals.subtotal) + '</div>';

  if (totals.discountPct > 0) {
    html += '<div class="total discount">Descuento (' + totals.discountPct + '%): -' + formatPrice(totals.discount) + '</div>';
  }

  html += '<div class="total">Total: ' + formatPrice(totals.total) + '</div>' +
    (notes ? '<div class="info" style="margin-top:10px"><b>Notas:</b> ' + notes + '</div>' : '') +
    '</body></html>';

  saveDownloadedFile(html, 'pedido_');
}

function downloadProviderPDF() {
  saveCurrentOrder();

  var items = currentOrder.items;
  var validItems = [];
  for (var sku in items) {
    var product = DATA.find(function(p) { return p.sku === sku; });
    if (product && parsePrice(product.precio_texto)) {
      validItems.push({ sku: sku, name: product.nombre, qty: items[sku] });
    }
  }

  if (validItems.length === 0) {
    alert('No hay productos validos para generar PDF');
    return;
  }

  var clientName = document.getElementById('clientName').value || '';
  var notes = document.getElementById('orderNotes').value || '';

  var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Pedido Proveedor</title>' +
    '<style>body{font-family:Roboto,\'Segoe UI\',Arial,sans-serif;padding:20px;font-size:12px}' +
    'h1{font-size:18px;margin-bottom:5px}table{width:100%;border-collapse:collapse;margin-top:10px}' +
    'col.cant{width:12%}col.cod{width:20%}col.desc{width:68%}' +
    'th,td{border:1px solid #ddd;padding:6px;text-align:center}' +
    'th{background:#2c3e50;color:#fff}.info{margin-bottom:10px;color:#555}' +
    '.nota{margin-top:10px}</style></head><body>' +
    '<h1>Pedido - LC 2050</h1>' +
    '<div class="info">Fecha: ' + new Date().toLocaleDateString('es-VE') + '</div>' +
    (clientName ? '<div class="info">Cliente: ' + clientName + '</div>' : '') +
    '<table><colgroup><col class="cant"><col class="cod"><col class="desc"></colgroup>' +
    '<thead><tr><th>Cantidad</th><th>Codigo</th><th>Descripcion</th></tr></thead><tbody>';

  validItems.forEach(function(item) {

  html += '</tbody></table>' +
    (notes ? '<div class="nota info"><b>Notas:</b> ' + notes + '</div>' : '') +
    '</body></html>';

  saveDownloadedFile(html, 'pedido_proveedor_');
}

function saveDownloadedFile(html, prefix) {
  var now = new Date();
  var pad = function(n) { return (n < 10 ? '0' : '') + n; };
  var fileName = prefix + now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + '_' + pad(now.getHours()) + pad(now.getMinutes()) + '.html';

  if (window.Android && window.Android.downloadPedido) {
    var result = window.Android.downloadPedido(fileName, html);
    var parts = result.split('|');
    if (parts[0] === 'OK') {
      showDownloadModal(
        '<div class="modal-download ok">' +
        '<div class="icon">' + ICON_CHECK + '</div>' +
        '<h2>Descarga exitosa</h2>' +
        '<p>Tu archivo se guardo como HTML.</p>' +
        '<div class="path">' + (parts[1] || fileName) + '</div>' +
        (parts[2] ? '<button class="btn-full btn-info" onclick="openDownloadedFile(\'' + parts[2] + '\')" style="margin-top:6px">Abrir archivo</button>' : '') +
        '<div class="note"><b>Como convertirlo a PDF:</b><br>' +
        'Abre el archivo con Google Drive o el navegador y elige <b>&quot;Imprimir&quot; &rarr; &quot;Guardar como PDF&quot;</b>, o usa una app convertidora de HTML a PDF.</div>' +
        '<button class="btn-full btn-secondary" onclick="closeDownloadModal()" style="margin-top:6px">Entendido</button>' +
        '</div>'
      );
    } else {
      showDownloadModal(
        '<div class="modal-download err">' +
        '<div class="icon">' + ICON_ERROR + '</div>' +
        '<h2>No se pudo descargar</h2>' +
        '<p>' + (parts[1] || 'Error al guardar el archivo') + '</p>' +
        '<button class="btn-full btn-secondary" onclick="closeDownloadModal()" style="margin-top:6px">Cerrar</button>' +
        '</div>'
      );
    }
    return;
  }

  var blob = new Blob([html], { type: 'text/html' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  a.click();
  URL.revokeObjectURL(url);

  showToast('Archivo descargado');
}

function openDownloadedFile(uri) {
  if (window.Android && window.Android.openFile) {
    var res = window.Android.openFile(uri);
    if (res && res.indexOf('ERR') === 0) {
      showToast(res.split('|')[1] || 'No se pudo abrir el archivo');
    }
  }
}

function showSettings() {
  showScreen('screenSettings');
  document.getElementById('headerTitle').textContent = 'Ajustes';
  document.getElementById('btnBack').style.display = 'inline';
  document.getElementById('whatsappNumber').value = getSetting('whatsappNumber', '584121234567');
  document.getElementById('clientNameSettings').value = getSetting('clientName', '');
}

function saveSettings() {
  setSetting('whatsappNumber', document.getElementById('whatsappNumber').value);
  setSetting('clientName', document.getElementById('clientNameSettings').value);
  showToast('Ajustes guardados');
  goBack();
}

function updateCatalogInfo() {
  var el = document.getElementById('catalogInfo');
  el.textContent = 'LC 2050 - ' + DATA.length + ' productos';
}

init();
